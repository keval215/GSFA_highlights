name: Deploy to Azure VM

# Pushes to main trigger a remote redeploy on the VM.
#
# Required GitHub repo secrets:
#   AZURE_VM_HOST           - public DNS / IP of the VM
#   AZURE_VM_USER           - SSH user (e.g. 'azureuser')
#   AZURE_VM_SSH_KEY        - private key contents (PEM); matching public key in ~/.ssh/authorized_keys on the VM
#   AZURE_VM_PORT           - optional; default 22
#
# Expected layout on the VM (one-time setup):
#   /opt/gsfa-highlights/        -> `git clone` of this repo
#   /etc/gsfa-highlights.env     -> env file with AZURE_STORAGE_CONNECTION_STRING, USE_GPU=1, etc.
#   /opt/gsfa-highlights/secrets/youtube_cookies.txt
#   Docker + nvidia-container-toolkit installed; user in the `docker` group.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: ${{ secrets.AZURE_VM_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/gsfa-highlights
            echo "[deploy] pulling latest from main..."
            git fetch --all
            git reset --hard origin/main
            echo "[deploy] rebuilding container..."
            docker compose up -d --build
            echo "[deploy] pruning old images..."
            docker image prune -f
            echo "[deploy] done."
