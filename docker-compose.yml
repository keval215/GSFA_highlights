# GSFA Highlights — api (no GPU) + worker (GPU) from the single image.
# Secrets/config come from /etc/gsfa-highlights.env on the VM.

services:
  api:
    build: .
    image: gsfa-highlights:latest
    command: python3.11 -m uvicorn service.api:app --host 0.0.0.0 --port 8000
    env_file: /etc/gsfa-highlights.env
    ports:
      - "8000:8000"
    volumes:
      - /mnt/data:/mnt/data
    restart: unless-stopped
    mem_limit: 3g
    mem_reservation: 1g

  worker:
    image: gsfa-highlights:latest
    command: python3.11 -m service.worker
    env_file: /etc/gsfa-highlights.env
    # Persist the HuggingFace cache on the /mnt/data volume so SigLIP's weights
    # and spiece.model survive container rebuilds. The team-fit pkl pickles a
    # SigLIP tokenizer that references these files by path; an ephemeral
    # container-local cache (/root/.cache) breaks the pkl after every rebuild.
    environment:
      - HF_HOME=/mnt/data/hf_cache
    gpus: all
    volumes:
      - /mnt/data:/mnt/data
      - /opt/gsfa-highlights/models:/opt/gsfa-highlights/models:ro
    restart: unless-stopped
    mem_limit: 21g
    mem_reservation: 6g
    depends_on:
      - api
