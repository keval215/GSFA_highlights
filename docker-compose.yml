# docker-compose.yml — single-service stack for the GSFA Highlights VM.
#
# On the VM:
#   sudo mkdir -p /mnt/data/jobs /opt/gsfa-highlights/secrets
#   cp youtube_cookies.txt /opt/gsfa-highlights/secrets/
#   docker compose up -d --build
#
# GitHub Actions runs `docker compose up -d --build` after `git pull` so
# new code picks up automatically.

services:
  highlights:
    build: .
    image: gsfa-highlights:latest
    container_name: gsfa-highlights
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - /etc/gsfa-highlights.env       # AZURE_STORAGE_CONNECTION_STRING, USE_GPU, etc.
    environment:
      - WORK_DIR=/tmp/jobs
    volumes:
      - /mnt/data/jobs:/tmp/jobs                  # large working dir for uploaded video + intermediates
    # GPU access — required for USE_GPU=1. Comment out the deploy block if running CPU-only.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
