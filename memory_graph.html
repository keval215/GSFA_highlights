<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GSFA_highlights — Memory Graph</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#12161f; --border:#232938; --text:#e6e9ef; --muted:#8b93a7;
    --hub:#f2c14e; --doc:#5aa9e6; --entry:#7fd1ae; --decision:#e8735c; --ext:#5b6478;
    --edge:#3a4256; --edge-strong:#5aa9e6;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6f8; --panel:#ffffff; --border:#dde1e8; --text:#1b1f27; --muted:#5b6472; --edge:#c7ccd6; }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;}
  #wrap{position:relative;width:100vw;height:100vh;}
  canvas{display:block;width:100%;height:100%;cursor:grab;}
  canvas.dragging{cursor:grabbing;}
  #title{position:absolute;top:14px;left:16px;z-index:5;}
  #title h1{font-size:15px;margin:0 0 2px;font-weight:600;letter-spacing:.2px;}
  #title p{font-size:11px;margin:0;color:var(--muted);max-width:420px;}
  #legend{position:absolute;bottom:14px;left:16px;z-index:5;background:var(--panel);border:1px solid var(--border);
    border-radius:10px;padding:10px 12px;font-size:11px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;max-width:min(90vw,560px);}
  .lg{display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;}
  #panel{position:absolute;top:0;right:0;height:100%;width:340px;max-width:88vw;background:var(--panel);
    border-left:1px solid var(--border);transform:translateX(100%);transition:transform .22s ease;z-index:10;
    overflow-y:auto;padding:18px;}
  #panel.open{transform:translateX(0);}
  #panel h2{font-size:13px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  #panel h3{font-size:15px;margin:0 0 10px;line-height:1.35;}
  #panel p{font-size:12.5px;line-height:1.55;color:var(--text);white-space:pre-wrap;}
  #panel .meta{font-size:10.5px;color:var(--muted);margin-bottom:14px;}
  #closeBtn{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;}
  #hint{position:absolute;top:14px;right:16px;z-index:5;font-size:11px;color:var(--muted);}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="title">
    <h1>GSFA_highlights — Supermemory Graph</h1>
    <p>Force-directed view of memories saved about this repo. Drag nodes, scroll to zoom, click a node for details.</p>
  </div>
  <div id="hint">click a node · drag to pan · scroll to zoom</div>
  <div id="legend">
    <div class="lg"><span class="dot" style="background:var(--hub)"></span>repo hub</div>
    <div class="lg"><span class="dot" style="background:var(--doc)"></span>architecture memory</div>
    <div class="lg"><span class="dot" style="background:var(--decision)"></span>decision / constraint</div>
    <div class="lg"><span class="dot" style="background:var(--entry)"></span>atomic sub-memory</div>
    <div class="lg"><span class="dot" style="background:var(--ext)"></span>unrelated prior memory</div>
  </div>
  <div id="panel">
    <button id="closeBtn">✕</button>
    <h2 id="panelGroup">Node</h2>
    <h3 id="panelTitle"></h3>
    <div class="meta" id="panelMeta"></div>
    <p id="panelBody"></p>
  </div>
</div>
<script>
const nodesRaw = [
  {id:"hub", label:"GSFA_highlights", group:"hub", r:26,
    body:"Repo root: futsal/football match-video analysis system at D:\\GSFA_highlights. Central hub for all memories saved about this codebase."},

  {id:"doc1", label:"Overview", group:"doc", r:16,
    body:"GSFA_highlights is a futsal/football match-video analysis system. Derives per-team (team0/team1) possession %, completed passes, interceptions, and ball-lost events from video, producing an append-only event log. Does not yet edit/cut highlight reels — the events table is raw material for a future highlight-reel builder."},

  {id:"doc2", label:"Per-frame Pipeline", group:"doc", r:18,
    body:"Perception stage: PlayerDetector (unified YOLOv11m) -> GSFATeamClassifier (SigLIP) -> GoalkeeperDetector. Ball stage: PlayerTracker (BoT-SORT) -> BallTracker (Kalman) -> CarrierEngine (foot-zone) -> PassEventTracker (release/travel/receive FSM). Fans out to PossessionStats (local) or MinuteCounters (service, SQL)."},

  {id:"doc3", label:"Two Execution Modes", group:"doc", r:17,
    body:"Mode A: local script video_analysis/possession.py -> run(), whole video file, renders annotated mp4 + summary, reference/debug implementation. Mode B: production service — api.py (FastAPI ingest, 60s clips + post_processing whole-match path) + worker.py (GPU, Azure Queue, writes SQL + HTTP callbacks). Mode B never renders video."},

  {id:"doc4", label:"Wire-format Types", group:"doc", r:15,
    body:"detectors/player_detector.py: Detection (bbox, confidence, foot_point, centre_point + mutable team_id/is_goalkeeper/track_id/embedding/smoothed_bbox) and FrameDetections (players/referees/goal_posts/balls/all). possession.py adds BallDetection and CarrierState. Every stage mutates Detection objects in place."},

  {id:"doc5", label:"Service Worker Flow", group:"doc", r:17,
    body:"Worker._handle per clip: 1) poison guard (MAX_DEQUEUE_COUNT) 2) idempotency on (match_id,half,minute) 3) ordering guard is_expected()/ORDERING_RETRIES 4) MatchSessionManager.get_or_create + team fit 5) clip_processor.process_clip at TARGET_PROCESS_FPS 6) one SQL transaction (minute row + correction + events + progress + outbox) 7) notifier POSTs cumulative stats 8) cleanup. stats.py mirrors possession.py constants, asserted at import."},

  {id:"doc6", label:"Correctness Invariants", group:"doc", r:17,
    body:"(1) Provisional credit + retroactive adjustment during pass travel phase, corrected via apply_adjustments / MinuteCounters.apply_adjustment + PriorCorrection across clip boundaries. (2) Cumulative-on-read: minute_stats stores raw per-minute counters only, SUM()-ed at read time, percentages derived after summing. (3) Transactional outbox: callback row written in same SQL transaction as minute row. (4) Idempotency + ordering guards."},

  {id:"doc7", label:"Unified YOLOv11m Change", group:"decision", r:15,
    body:"Pipeline used to run two detection models per frame (YOLOv11 players + RF-DETR ball). Now runs one unified YOLOv11m model emitting active_player/ball/goal_post/referee; best_ball() picks the ball from the same forward pass. Old RF-DETR ball model + weights removed entirely. heatmap.py and shots_on_t.py remain standalone/experimental, still on the older separate detectors."},

  {id:"doc8", label:"Repository Layout", group:"doc", r:16,
    body:"detectors/, team_classifier/, tracking/ (BoT-SORT), video_analysis/, service/ (api.py + worker.py + session/clip_processor/stats/db/notifier), sql/ (matches, minute_stats, post_processing, events, callback_outbox), scripts/ (CSV export, clip upload, diagnostics), data/ (gitignored), heatmap.py, shots_on_t.py, Dockerfile/compose, CI: push to main -> SSH redeploy on Azure VM."},

  {id:"doc9", label:"Team Classifier Decision", group:"decision", r:14,
    body:"Always use GSFATeamClassifier (SigLIP-based), never ColourHistogramTeamClassifier — explicit user preference. SigLIP embeddings are the production default for team assignment."},

  {id:"doc10", label:"Docker Python 3.11 Constraint", group:"decision", r:14,
    body:"Docker must use deadsnakes Python 3.11 — Ubuntu's default Python 3.11.0rc1 segfaults torch.jit.script inside rfdetr-related code paths."},

  // atomic sub-memories (auto-extracted by supermemory)
  {id:"e1", label:"YOLOv11m detector classes", group:"entry", r:8, parent:"doc2",
    body:"GSFA perception pipeline stage uses YOLOv11m for PlayerDetector to identify active_player, ball, goal_post, and referee classes."},
  {id:"e2", label:"SigLIP team + GK", group:"entry", r:8, parent:"doc2",
    body:"GSFA perception pipeline uses GSFATeamClassifier with SigLIP embeddings for team assignment, followed by a dedicated GoalkeeperDetector."},
  {id:"e3", label:"BoT-SORT/Kalman/Carrier/FSM", group:"entry", r:8, parent:"doc2",
    body:"GSFA ball possession tracking uses BoT-SORT for players, a Kalman filter for ball tracking, a foot-zone based CarrierEngine, and an FSM for pass events."},
  {id:"e4", label:"Local vs service output", group:"entry", r:8, parent:"doc2",
    body:"GSFA output processing is split between local mode (PossessionStats in-memory) and service mode (writes to SQL minute_stats)."},

  {id:"e5", label:"8-step worker flow", group:"entry", r:8, parent:"doc5",
    body:"GSFA service-mode worker flow handles clips in 8 distinct steps: poison guard, idempotency check, ordering guard, session management via MatchSessionManager, CV pipeline processing at TARGET_PROCESS_FPS, single SQL transaction write, notifier POST, and cleanup."},
  {id:"e6", label:"Idempotency key", group:"entry", r:8, parent:"doc5", extends:"e5",
    body:"GSFA service worker employs an idempotency check using the primary key (match_id, half, minute) to prevent duplicate processing."},
  {id:"e7", label:"stats.py mirror assertion", group:"entry", r:8, parent:"doc5",
    body:"GSFA service worker uses service/stats.py to mirror possession.py constants, asserting they match at import time to ensure configuration consistency."},

  {id:"e8", label:"Provisional credit", group:"entry", r:8, parent:"doc6",
    body:"GSFA system correctness invariant: provisional credit is issued for passes during the travel phase, with retroactive adjustments handled via PossessionStats.apply_adjustments or MinuteCounters.apply_adjustment if an interception or loss occurs."},
  {id:"e9", label:"Cumulative-on-read", group:"entry", r:8, parent:"doc6",
    body:"GSFA system correctness invariant: minute_stats table stores raw per-minute counters exclusively, with cumulative totals and percentages calculated at read time via db.cumulative_read."},
  {id:"e10", label:"Transactional outbox", group:"entry", r:8, parent:"doc6",
    body:"GSFA system correctness invariant: callback payloads are written to the database using a transactional outbox pattern, ensuring they are committed in the same SQL transaction as the corresponding minute row."},
  {id:"e11", label:"Idempotency + ordering guards", group:"entry", r:8, parent:"doc6",
    body:"GSFA system utilizes idempotency and ordering guards to prevent duplicate or out-of-order data processing."},

  // pre-existing unrelated memory from a different project/exploration
  {id:"ext1", label:"Deep-EIoU / GTA-Link tracker (other/prior)", group:"ext", r:15,
    body:"Pre-existing memory (2026-05-14), NOT part of the current GSFA_highlights pipeline. Describes a two-pass Deep-EIoU + OSNet ReID + GTA-Link tracking approach. The current repo actually uses BoT-SORT (tracking/player_tracker.py) with external SigLIP embeddings instead — kept here only as a disconnected node so it isn't confused with the live architecture."}
];

const linksRaw = [
  ["hub","doc1"], ["hub","doc8"],
  ["doc1","doc3"], ["doc1","doc2"],
  ["doc3","doc2"], ["doc3","doc5"],
  ["doc5","doc6"], ["doc2","doc4"],
  ["doc2","doc7"], ["doc8","doc9"],
  ["doc8","doc10"], ["doc9","doc2"],
  ["doc2","e1"], ["doc2","e2"], ["doc2","e3"], ["doc2","e4"],
  ["doc5","e5"], ["doc5","e6"], ["doc5","e7"], ["e5","e6"],
  ["doc6","e8"], ["doc6","e9"], ["doc6","e10"], ["doc6","e11"]
];

const groupColor = {
  hub: getCss('--hub'), doc: getCss('--doc'), decision: getCss('--decision'),
  entry: getCss('--entry'), ext: getCss('--ext')
};
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W,H;
function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);

const nodes = nodesRaw.map((n,i)=>{
  const angle = (i/nodesRaw.length)*Math.PI*2;
  return Object.assign({}, n, {
    x: W/2 + Math.cos(angle)*260 + (Math.random()-0.5)*40,
    y: H/2 + Math.sin(angle)*260 + (Math.random()-0.5)*40,
    vx:0, vy:0
  });
});
const nodeById = Object.fromEntries(nodes.map(n=>[n.id,n]));
// isolate ext1 off to the side, unconnected
const extNode = nodeById['ext1'];
extNode.x = W*0.87; extNode.y = H*0.85;

const links = linksRaw.map(([a,b])=>({source:nodeById[a], target:nodeById[b]}));

let view = {x:0,y:0,scale:1};
let dragNode=null, dragging=false, last=null, moved=false;

function simulate(){
  const REPULSE = 2600, SPRING = 0.02, IDEAL = 90, CENTER = 0.0015, DAMP = 0.86;
  for(let i=0;i<nodes.length;i++){
    const a = nodes[i];
    if(a===extNode) continue; // keep isolated node calmer
    let fx=0, fy=0;
    for(let j=0;j<nodes.length;j++){
      if(i===j) continue;
      const b = nodes[j];
      let dx=a.x-b.x, dy=a.y-b.y;
      let d2 = dx*dx+dy*dy || 0.01;
      let d = Math.sqrt(d2);
      let f = REPULSE/d2;
      fx += (dx/d)*f; fy += (dy/d)*f;
    }
    fx += (W/2-a.x)*CENTER; fy += (H/2-a.y)*CENTER;
    a.fx=fx; a.fy=fy;
  }
  for(const l of links){
    const dx=l.target.x-l.source.x, dy=l.target.y-l.source.y;
    const d = Math.sqrt(dx*dx+dy*dy)||0.01;
    const f = (d-IDEAL)*SPRING;
    const ux=dx/d, uy=dy/d;
    if(l.source!==dragNode){ l.source.fx+=ux*f; l.source.fy+=uy*f; }
    if(l.target!==dragNode){ l.target.fx-=ux*f; l.target.fy-=uy*f; }
  }
  for(const n of nodes){
    if(n===dragNode || n===extNode) continue;
    n.vx = (n.vx + (n.fx||0)) * DAMP;
    n.vy = (n.vy + (n.fy||0)) * DAMP;
    n.x += n.vx; n.y += n.vy;
  }
}

function draw(){
  ctx.save();
  ctx.clearRect(0,0,W,H);
  ctx.translate(view.x, view.y);
  ctx.scale(view.scale, view.scale);

  ctx.lineWidth = 1/view.scale;
  for(const l of links){
    ctx.strokeStyle = getCss('--edge');
    ctx.beginPath();
    ctx.moveTo(l.source.x, l.source.y);
    ctx.lineTo(l.target.x, l.target.y);
    ctx.stroke();
  }
  for(const n of nodes){
    ctx.beginPath();
    ctx.fillStyle = groupColor[n.group] || '#999';
    ctx.globalAlpha = n.group==='ext' ? 0.55 : 1;
    ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
    if(n===hoverNode || n===selectedNode){
      ctx.lineWidth = 2/view.scale;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
    }
    ctx.fillStyle = getCss('--text');
    ctx.font = `${n.group==='hub'?13:11}px -apple-system,Segoe UI,Roboto,sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(n.label, n.x, n.y + n.r + 13);
  }
  ctx.restore();
}

let hoverNode=null, selectedNode=null;

function toWorld(px,py){
  return { x:(px-view.x)/view.scale, y:(py-view.y)/view.scale };
}
function nodeAt(px,py){
  const w = toWorld(px,py);
  for(let i=nodes.length-1;i>=0;i--){
    const n=nodes[i];
    const dx=w.x-n.x, dy=w.y-n.y;
    if(dx*dx+dy*dy <= n.r*n.r) return n;
  }
  return null;
}

canvas.addEventListener('mousedown', e=>{
  const n = nodeAt(e.offsetX, e.offsetY);
  moved = false;
  if(n){ dragNode = n; }
  else { dragging = true; canvas.classList.add('dragging'); }
  last = {x:e.clientX, y:e.clientY};
});
addEventListener('mousemove', e=>{
  if(last){
    const dx=e.clientX-last.x, dy=e.clientY-last.y;
    if(Math.abs(dx)+Math.abs(dy) > 2) moved = true;
  }
  if(dragNode){
    const w = toWorld(e.offsetX, e.offsetY);
    dragNode.x = w.x; dragNode.y = w.y; dragNode.vx=0; dragNode.vy=0;
    last = {x:e.clientX, y:e.clientY};
  } else if(dragging && last){
    view.x += e.clientX-last.x; view.y += e.clientY-last.y;
    last = {x:e.clientX, y:e.clientY};
  } else {
    hoverNode = nodeAt(e.offsetX, e.offsetY);
    canvas.style.cursor = hoverNode ? 'pointer' : 'grab';
  }
});
addEventListener('mouseup', e=>{
  if(dragNode && !moved){ selectNode(dragNode); }
  dragNode = null; dragging=false; last=null;
  canvas.classList.remove('dragging');
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  const before = toWorld(e.offsetX, e.offsetY);
  view.scale = Math.min(4, Math.max(0.25, view.scale*factor));
  const after = toWorld(e.offsetX, e.offsetY);
  view.x += (after.x-before.x)*view.scale;
  view.y += (after.y-before.y)*view.scale;
}, {passive:false});

const panel = document.getElementById('panel');
document.getElementById('closeBtn').onclick = ()=>{ panel.classList.remove('open'); selectedNode=null; };

function selectNode(n){
  selectedNode = n;
  document.getElementById('panelGroup').textContent =
    n.group==='hub' ? 'Repo' : n.group==='doc' ? 'Architecture memory' :
    n.group==='decision' ? 'Decision / constraint' : n.group==='entry' ? 'Atomic sub-memory' : 'Unrelated prior memory';
  document.getElementById('panelTitle').textContent = n.label;
  document.getElementById('panelMeta').textContent = n.parent ? `part of: ${nodeById[n.parent].label}` : '';
  document.getElementById('panelBody').textContent = n.body;
  panel.classList.add('open');
}

function loop(){
  simulate();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
