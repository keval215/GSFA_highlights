<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GSFA Highlights</title>
<style>
  :root {
    /* Primary — purple */
    --primary: #6c28d8;
    --primary-dark: #5820b0;
    --primary-bright: #9b4fff;
    --primary-light: #d2b4ff;
    --primary-tint: #e5d5ff;
    --primary-wash: #f1e8ff;
    --primary-ghost: rgba(82, 50, 215, 0.10);

    /* Text */
    --text: #ffffff;
    --text-secondary: #d0d5db;
    --muted: #97a1af;
    --placeholder: #687282;

    /* Backgrounds & surfaces */
    --app-bg: #0d1828;
    --surface: #1a2939;
    --card-elevated: #334153;
    --overlay: rgba(16, 24, 40, 0.6);

    /* Borders & status */
    --border: #334153;
    --ok: #22c55e;
    --err: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
    background: var(--app-bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .card {
    width: 100%; max-width: 620px; margin: auto;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 28px 32px;
    box-shadow: 0 12px 40px rgba(0,0,0,.4);
  }
  h1 { margin: 0 0 4px; font-size: 22px; color: var(--text); }
  .tagline { color: var(--text-secondary); margin-bottom: 20px; font-size: 13px; }
  label { display: block; margin: 14px 0 6px; font-size: 13px; color: var(--text-secondary); }
  input[type="text"], input[type="file"] {
    width: 100%; padding: 10px 12px;
    background: var(--app-bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font: inherit;
  }
  input::placeholder { color: var(--placeholder); }
  input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-ghost); }
  input[type="file"]::file-selector-button {
    background: var(--card-elevated); color: var(--text); border: 0;
    padding: 6px 12px; border-radius: 6px; margin-right: 12px;
    cursor: pointer; font: inherit;
  }
  input[type="file"]::file-selector-button:hover { background: var(--primary); color: #fff; }
  button {
    width: 100%; margin-top: 20px;
    padding: 12px; border: none; border-radius: 8px;
    background: var(--primary); color: #fff;
    font: 600 15px/1.2 inherit; cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: var(--primary-dark); color: #fff; }
  button:disabled { background: var(--card-elevated); color: var(--muted); cursor: not-allowed; }
  button.ghost {
    background: transparent; color: var(--text); border: 1px solid var(--border);
    padding: 8px 14px; margin: 0; width: auto; font-weight: 500; font-size: 13px;
  }
  button.ghost:hover { background: var(--primary-ghost); color: var(--primary-light); border-color: var(--primary); }
  button.danger {
    background: transparent; color: var(--err); border: 1px solid var(--err);
    padding: 8px 14px; margin: 0; width: auto; font-weight: 500; font-size: 13px;
  }
  button.danger:hover { background: rgba(239,68,68,.1); color: var(--err); }
  button.danger.block {
    width: 100%; padding: 10px; font-size: 14px; font-weight: 600;
  }
  .cancel-row { margin-top: 12px; }

  .status { margin-top: 20px; display: none; }
  .status.visible { display: block; }
  .stage-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: var(--muted); margin-bottom: 8px; gap: 12px;
  }
  .stage-row strong { color: var(--text); text-transform: capitalize; }
  .bar {
    height: 8px; background: var(--app-bg); border-radius: 4px; overflow: hidden;
    border: 1px solid var(--border);
  }
  .bar-fill {
    height: 100%; background: var(--primary); width: 0%;
    transition: width .4s ease;
  }
  .meta { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .meta b { color: var(--text); }

  .result {
    margin-top: 20px; padding: 16px;
    background: rgba(34,197,94,.08); border: 1px solid rgba(34,197,94,.3);
    border-radius: 8px; display: none;
  }
  .result.visible { display: block; }
  .result a {
    display: inline-block; margin-top: 10px;
    padding: 10px 16px; background: var(--ok); color: #052e15;
    border-radius: 6px; text-decoration: none; font-weight: 600;
  }
  .error {
    margin-top: 20px; padding: 14px;
    background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.3);
    border-radius: 8px; color: var(--err); font-size: 13px; display: none;
    word-break: break-word;
  }
  .error.visible { display: block; }

  details.history {
    margin-top: 24px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--app-bg);
  }
  details.history summary {
    cursor: pointer; padding: 12px 14px; font-size: 13px; color: var(--muted);
    user-select: none;
  }
  details.history summary:hover { color: var(--text); }
  details.history[open] summary { border-bottom: 1px solid var(--border); color: var(--text); }
  .history-list { padding: 8px 0; max-height: 360px; overflow-y: auto; }
  .history-list:empty::after {
    content: "No past jobs."; display: block; padding: 14px;
    color: var(--muted); font-size: 13px; text-align: center;
  }
  .h-row {
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center;
  }
  .h-row:last-child { border-bottom: 0; }
  .h-row .title { font-size: 13px; color: var(--text); }
  .h-row .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .h-row .actions { display: flex; gap: 8px; }
  .h-row.running { background: var(--primary-ghost); }
  .h-row .pill {
    display: inline-block; padding: 1px 8px; border-radius: 10px;
    font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    margin-left: 6px;
  }
  .pill.done { background: rgba(34,197,94,.15); color: #22c55e; }
  .pill.running { background: var(--primary-ghost); color: var(--primary-light); }
  .pill.failed { background: rgba(239,68,68,.15); color: var(--err); }
  .pill.cancelled { background: rgba(154,164,178,.2); color: var(--muted); }
  .h-row a.dl {
    color: var(--ok); text-decoration: none; font-size: 12px;
    border: 1px solid var(--ok); padding: 4px 10px; border-radius: 6px;
  }
  .h-row a.dl:hover { background: rgba(34,197,94,.1); }

  .history-footer {
    padding: 10px 14px; border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end;
  }

  .footer { margin-top: 28px; font-size: 11px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>GSFA Highlights</h1>
  <div class="tagline">Upload a match video to auto-generate a highlight reel.</div>

  <form id="job-form">
    <label for="file">Match video <span style="opacity:.7">(mp4, mkv, mov, webm — up to 15 GB)</span></label>
    <input id="file" name="file" type="file"
           accept=".mp4,.mkv,.mov,.webm,video/mp4,video/x-matroska,video/quicktime,video/webm"
           required />

    <label for="match">Match name <span style="opacity:.7">(used in the filename)</span></label>
    <input id="match" name="match" type="text" placeholder="osfa_vs_anc" autocomplete="off" />

    <button id="submit" type="submit">Generate Highlights</button>
  </form>

  <div class="status" id="status">
    <div class="stage-row">
      <span>Status</span>
      <span><strong id="stage-label">—</strong></span>
    </div>
    <div class="bar"><div class="bar-fill" id="bar"></div></div>
    <div class="meta" id="meta"></div>
    <div class="cancel-row">
      <button id="cancel-btn" class="danger block" style="display:none;">Cancel</button>
    </div>
  </div>

  <div class="result" id="result">
    <div>Done. Your highlight reel is ready.</div>
    <a id="download" href="#">Download highlights.mp4</a>
  </div>

  <div class="error" id="error"></div>

  <details class="history" id="history">
    <summary id="history-summary">Past highlights (0)</summary>
    <div class="history-list" id="history-list"></div>
    <div class="history-footer">
      <button class="danger" id="clear-all">Clear all</button>
    </div>
  </details>

  <div class="footer">Single job at a time on this server. Long matches take 20–40 min on a T4 GPU.</div>
</div>

<script>
const form = document.getElementById('job-form');
const submitBtn = document.getElementById('submit');
const fileInput = document.getElementById('file');
const statusBox = document.getElementById('status');
const bar = document.getElementById('bar');
const stageLabel = document.getElementById('stage-label');
const meta = document.getElementById('meta');
const result = document.getElementById('result');
const downloadLink = document.getElementById('download');
const errorBox = document.getElementById('error');
const cancelBtn = document.getElementById('cancel-btn');
const historyEl = document.getElementById('history');
const historySummary = document.getElementById('history-summary');
const historyList = document.getElementById('history-list');
const clearAllBtn = document.getElementById('clear-all');

let activeJobId = null;
let activeStream = null;
let activeXhr = null;

function show(el) { el.classList.add('visible'); }
function hide(el) { el.classList.remove('visible'); }
function fmtBytes(n) {
  if (!n && n !== 0) return '';
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  if (n < 1024*1024*1024) return (n/1024/1024).toFixed(1) + ' MB';
  return (n/1024/1024/1024).toFixed(2) + ' GB';
}
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  return d.toLocaleString();
}

function resetUiForNewSubmit() {
  hide(result); hide(errorBox);
  show(statusBox);
  bar.style.width = '0%';
  stageLabel.textContent = 'queued';
  meta.innerHTML = '';
  cancelBtn.style.display = 'inline-block';
  cancelBtn.disabled = false;
  cancelBtn.textContent = 'Cancel upload';
}

function clearActiveUi() {
  hide(statusBox); hide(result); hide(errorBox);
  activeJobId = null;
  if (activeStream) { activeStream.close(); activeStream = null; }
  activeXhr = null;
  cancelBtn.style.display = 'none';
}

function resetSubmit() {
  submitBtn.disabled = false;
  submitBtn.textContent = 'Generate Highlights';
}

function showError(msg) {
  errorBox.textContent = msg;
  show(errorBox);
}

form.addEventListener('submit', (e) => {
  e.preventDefault();

  const f = fileInput.files[0];
  if (!f) { showError('Pick a video file first.'); return; }

  resetUiForNewSubmit();
  submitBtn.disabled = true;
  submitBtn.textContent = 'Uploading…';
  stageLabel.textContent = 'uploading';
  meta.innerHTML = `File: <b>${f.name}</b> · Size: <b>${fmtBytes(f.size)}</b>`;

  const match = document.getElementById('match').value.trim();
  const fd = new FormData();
  fd.append('file', f);
  fd.append('match', match);

  const xhr = new XMLHttpRequest();
  activeXhr = xhr;
  xhr.open('POST', '/jobs', true);

  xhr.upload.onprogress = (ev) => {
    if (!ev.lengthComputable) return;
    const pct = ev.loaded / ev.total;
    bar.style.width = (pct * 100).toFixed(1) + '%';
    meta.innerHTML =
      `File: <b>${f.name}</b> · Uploaded: <b>${fmtBytes(ev.loaded)} / ${fmtBytes(ev.total)}</b>`;
  };

  xhr.onload = () => {
    activeXhr = null;
    if (xhr.status >= 200 && xhr.status < 300) {
      try {
        const { job_id } = JSON.parse(xhr.responseText);
        activeJobId = job_id;
        bar.style.width = '0%';
        stageLabel.textContent = 'queued';
        meta.innerHTML = `File: <b>${f.name}</b> · Job: <b>${job_id}</b>`;
        submitBtn.textContent = 'Processing…';
        cancelBtn.style.display = 'inline-block';
        cancelBtn.disabled = false;
        cancelBtn.textContent = 'Cancel';
        streamJob(job_id);
        refreshHistory();
      } catch (e) {
        showError('Bad response from server.');
        cancelBtn.style.display = 'none';
        resetSubmit();
      }
    } else {
      let msg = `HTTP ${xhr.status}`;
      try { msg = JSON.parse(xhr.responseText).detail || msg; } catch {}
      showError(msg);
      cancelBtn.style.display = 'none';
      resetSubmit();
    }
  };

  xhr.onerror = () => {
    activeXhr = null;
    cancelBtn.style.display = 'none';
    showError('Upload failed (network error).');
    resetSubmit();
  };
  xhr.onabort = () => {
    activeXhr = null;
    cancelBtn.style.display = 'none';
    showError('Upload aborted.');
    resetSubmit();
  };

  xhr.send(fd);
});

cancelBtn.addEventListener('click', async () => {
  // Upload phase: no job_id yet, but XHR is in flight -> abort it.
  if (!activeJobId && activeXhr) {
    cancelBtn.disabled = true;
    cancelBtn.textContent = 'Cancelling…';
    try { activeXhr.abort(); } catch {}
    return;
  }
  if (!activeJobId) return;
  // Processing phase: cooperative cancel on the backend.
  cancelBtn.disabled = true;
  cancelBtn.textContent = 'Cancelling…';
  try {
    const r = await fetch(`/jobs/${activeJobId}/cancel`, { method: 'POST' });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.detail || `HTTP ${r.status}`);
    }
    refreshHistory();
  } catch (e) {
    showError(e.message);
    cancelBtn.disabled = false;
    cancelBtn.textContent = 'Cancel';
  }
});

clearAllBtn.addEventListener('click', async () => {
  if (!confirm('Delete all past highlight links and their Azure copies? This cannot be undone.')) return;
  clearAllBtn.disabled = true;
  try {
    const r = await fetch('/jobs', { method: 'DELETE' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    if (data.blob_failures && data.blob_failures.length) {
      showError(`Cleared ${data.deleted} entries, but failed to delete ${data.blob_failures.length} blob(s).`);
    }
    await refreshHistory();
  } catch (e) {
    showError(e.message);
  } finally {
    clearAllBtn.disabled = false;
  }
});

function streamJob(jobId) {
  if (activeStream) { activeStream.close(); activeStream = null; }
  const es = new EventSource(`/jobs/${jobId}/events`);
  activeStream = es;
  es.onmessage = (e) => {
    let j;
    try { j = JSON.parse(e.data); } catch { return; }
    if (j.error) {
      showError(j.error);
      es.close();
      activeStream = null;
      return;
    }
    updateActiveUi(j);
    if (j.status === 'done' || j.status === 'failed' || j.status === 'cancelled') {
      es.close();
      activeStream = null;
      refreshHistory();
    }
  };
  es.onerror = () => {
    es.close();
    activeStream = null;
  };
}

function updateActiveUi(j) {
  stageLabel.textContent = j.stage || j.status;
  bar.style.width = `${Math.round((j.progress || 0) * 100)}%`;
  const bits = [];
  if (j.filename) bits.push(`File: <b>${j.filename}</b>`);
  if (j.size_bytes) bits.push(`Size: <b>${fmtBytes(j.size_bytes)}</b>`);
  if (j.goals_found !== undefined) bits.push(`Goals: <b>${j.goals_found}</b>`);
  if (j.endgame_clips !== undefined) bits.push(`Endgame: <b>${j.endgame_clips}</b>`);
  meta.innerHTML = bits.join(' · ');

  const inFlight = (j.status === 'queued' || j.status === 'running');
  cancelBtn.style.display = inFlight ? 'inline-block' : 'none';

  if (j.status === 'done') {
    bar.style.width = '100%';
    downloadLink.href = j.result_url;
    downloadLink.textContent = `Download ${j.blob_name || 'highlights.mp4'}`;
    show(result);
    resetSubmit();
  } else if (j.status === 'failed') {
    showError(j.error || 'Job failed.');
    resetSubmit();
  } else if (j.status === 'cancelled') {
    showError('Job cancelled.');
    resetSubmit();
  }
}

function renderHistory(jobs) {
  historySummary.textContent = `Past highlights (${jobs.length})`;
  historyList.innerHTML = '';
  for (const j of jobs) {
    const row = document.createElement('div');
    row.className = 'h-row' + (j.status === 'running' || j.status === 'queued' ? ' running' : '');

    const left = document.createElement('div');
    const title = document.createElement('div');
    title.className = 'title';
    title.innerHTML = `<b>${j.match || '(no name)'}</b>` +
      ` <span class="pill ${j.status}">${j.status}</span>`;
    const sub = document.createElement('div');
    sub.className = 'sub';
    const subBits = [];
    if (j.filename) subBits.push(j.filename);
    if (j.size_bytes) subBits.push(fmtBytes(j.size_bytes));
    if (j.goals_found !== undefined) subBits.push(`${j.goals_found} goals`);
    if (j.endgame_clips !== undefined) subBits.push(`${j.endgame_clips} endgame`);
    if (j.finished_at) subBits.push(fmtTime(j.finished_at));
    else if (j.created_at) subBits.push(fmtTime(j.created_at));
    if ((j.status === 'running' || j.status === 'queued') && j.stage)
      subBits.push(`stage: ${j.stage} (${Math.round((j.progress||0)*100)}%)`);
    if (j.error) subBits.push(j.error);
    sub.textContent = subBits.join(' · ');
    left.appendChild(title);
    left.appendChild(sub);

    const actions = document.createElement('div');
    actions.className = 'actions';
    if (j.status === 'done' && j.result_url) {
      const a = document.createElement('a');
      a.className = 'dl';
      a.href = j.result_url;
      a.textContent = 'Download';
      actions.appendChild(a);
    }
    if (j.status === 'running' || j.status === 'queued') {
      const btn = document.createElement('button');
      btn.className = 'danger';
      btn.textContent = 'Cancel';
      btn.addEventListener('click', async () => {
        btn.disabled = true; btn.textContent = 'Cancelling…';
        try { await fetch(`/jobs/${j.id}/cancel`, { method: 'POST' }); }
        catch {}
        refreshHistory();
      });
      actions.appendChild(btn);
    }

    row.appendChild(left);
    row.appendChild(actions);
    historyList.appendChild(row);
  }
}

async function refreshHistory() {
  try {
    const r = await fetch('/jobs');
    if (!r.ok) return;
    const data = await r.json();
    renderHistory(data.jobs || []);
  } catch {}
}

refreshHistory();
</script>
</body>
</html>
